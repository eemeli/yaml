name: Feature request
description: Suggest an idea for this library
labels: enhancement

body:
  - type: checkboxes
    attributes:
      label: Checklist
      description: Please ensure you have completed each of the following.
      options:
        - label: I have read the [Contributing Guidelines](https://github.com/eemeli/yaml/blob/main/docs/CONTRIBUTING.md).
          required: true
        - label: I affirm that I am submitting my own writing, and not the output of an LLM or similar tool.
          required: true

  - type: textarea
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem is. For example, "I'm always frustrated when [...]"
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe the solution you'd like.
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here.
    validations:
      required: false
